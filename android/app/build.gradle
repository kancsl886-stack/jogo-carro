plugins {
    id "com.android.application"
}

android {
    namespace "com.nitrosurf.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.nitrosurf.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.3"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("syncGameAssets", Copy) {
    from("${rootProject.projectDir}/../Nitro-Surf.html")
    into("${projectDir}/src/main/assets/www")
    rename { "index.html" }
}

preBuild.dependsOn("syncGameAssets")

dependencies {}
